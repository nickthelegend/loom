<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0a'/%3E%3Ctext x='50' y='60' font-size='36' text-anchor='middle' fill='%23fafafa' font-family='-apple-system,Segoe UI,sans-serif' font-weight='600'%3Elo%3C/text%3E%3Crect x='32' y='70' width='36' height='4' rx='2' fill='%2367e8f9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/vendor/xterm.css">
<title>Loom</title>
<script>
/* Apply the saved theme before first paint so there is no flash. */
try{var t=localStorage.getItem("loomTheme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.classList.remove("dark")}catch(e){}
/* The telemetry backend's own UI, for the trace deep links, injected by the
   daemon from LOOM_TRACE_UI_URL. Empty unless one is configured — the links
   hide themselves rather than pointing at a guessed port. */
window.__loomTraceUrl="%%TRACE_UI_URL%%";
window.__loomPageRev="%%BUILD_REV%%";
</script>
<style>%%APP_CSS%%</style>
</head>
<body id="loom-app">
<!-- ADE brand marks, defined once (see brand-icons.ts). Every agent glyph on
     the page is a <use> of one of these symbols. -->
%%BRAND_SPRITE%%
<div id="root"></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="a11y-alert" role="alert" aria-live="assertive" class="visually-hidden"></div>
<!-- xterm.js, served by the daemon from node_modules: the app has no build
     step and must work offline on a tailnet, so no bundler and no CDN. Only
     used when the daemon has a real pty; the fallback needs none of it. -->
<script src="/app/vendor/xterm.js"></script>
<script src="/app/vendor/addon-fit.js"></script>
<script src="/app/vendor/addon-web-links.js"></script>
<script>
%%APP_JS%%
</script>
</body>
</html>
