<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#r-close{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#r-close .clip{position:absolute}
#r-close .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#r-close .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#r-close .m{font-family:"LoomMono",monospace}
/* subtitle: one line, centred low, on a plate so it survives any footage */
#r-close .sub{left:0;right:0;bottom:66px;text-align:center;font-size:37px;font-weight:600;letter-spacing:-.01em}
#r-close .sub span{background:rgba(10,10,11,.9);padding:11px 26px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.75}
#r-close .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:22px;letter-spacing:.05em;
  padding:8px 15px;border-radius:6px}
#r-close .ttl{font-size:180px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="r-close" data-composition-id="r-close" data-width="1920" data-height="1080" data-start="0" data-duration="4.6">
<div class="clip bg" id="r-close-bg" data-start="0" data-duration="4.6" data-track-index="0"></div>
<div class="clip ttl" id="w" style="top:330px;font-size:160px" data-start="0" data-duration="4.6" data-track-index="1">LOOM</div>
    <div class="clip" id="s2" style="left:0;right:0;top:520px;text-align:center;font-size:35px;color:#A1A1AA" data-start="0" data-duration="4.6" data-track-index="2">one brain, every agent</div>
    <div class="clip m" id="i" style="left:0;right:0;top:620px;text-align:center;font-size:30px;color:#FF6B2B" data-start="0" data-duration="4.6" data-track-index="3">npm i -g @loompad/cli</div>
    <div class="clip m" id="g" style="left:0;right:0;top:676px;text-align:center;font-size:20px;color:#5a5a63" data-start="0" data-duration="4.6" data-track-index="4">github.com/nickthelegend/loom</div>
<div class="clip sub" id="sb0" data-start="0" data-duration="4.6" data-track-index="40"><span>Loom. One brain, every agent.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["r-close"]=tl;
gsap.set('#w',{opacity:0,scale:.93});gsap.set(['#s2','#i','#g'],{opacity:0,y:14});
tl.to('#w',{opacity:1,scale:1,duration:.4,ease:"back.out(2)"},0).to(['#s2','#i','#g'],{opacity:1,y:0,duration:.3,stagger:.11},.34);
gsap.set('#sb0',{opacity:0,y:14});
tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.12);
tl.to('#sb0',{opacity:0,duration:.14},4.56);})();</script></body></html>
