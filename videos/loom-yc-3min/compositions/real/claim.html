<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#r-claim{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#r-claim .clip{position:absolute}
#r-claim .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#r-claim .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#r-claim .m{font-family:"LoomMono",monospace}
/* subtitle: one line, centred low, on a plate so it survives any footage */
#r-claim .sub{left:0;right:0;bottom:66px;text-align:center;font-size:37px;font-weight:600;letter-spacing:-.01em}
#r-claim .sub span{background:rgba(10,10,11,.9);padding:11px 26px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.75}
#r-claim .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:22px;letter-spacing:.05em;
  padding:8px 15px;border-radius:6px}
#r-claim .ttl{font-size:180px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="r-claim" data-composition-id="r-claim" data-width="1920" data-height="1080" data-start="0" data-duration="2.4">
<div class="clip bg" id="r-claim-bg" data-start="0" data-duration="2.4" data-track-index="0"></div>
<div class="clip ttl" id="w" style="top:400px" data-start="0" data-duration="2.4" data-track-index="1">LOOM</div>
    <div class="clip m" id="r" style="left:860px;top:625px;width:0;height:4px;background:#FF6B2B" data-start="0" data-duration="2.4" data-track-index="2"></div>
    <div class="clip m" id="t" style="left:0;right:0;top:665px;text-align:center;font-size:28px;color:#A1A1AA" data-start="0" data-duration="2.4" data-track-index="3">the shared-memory layer for AI coding agents</div>
<div class="clip sub" id="sb0" data-start="0" data-duration="2.4" data-track-index="40"><span>Loom makes them one brain.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["r-claim"]=tl;
gsap.set('#w',{opacity:0,scale:.9});gsap.set('#t',{opacity:0});
tl.to('#w',{opacity:1,scale:1,duration:.4,ease:"back.out(2)"},0).to('#r',{width:200,duration:.3},.38).to('#t',{opacity:1,duration:.28},.55);
gsap.set('#sb0',{opacity:0,y:14});
tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.12);
tl.to('#sb0',{opacity:0,duration:.14},2.36);})();</script></body></html>
