<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#r-build{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#r-build .clip{position:absolute}
#r-build .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#r-build .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#r-build .m{font-family:"LoomMono",monospace}
/* subtitle: one line, centred low, on a plate so it survives any footage */
#r-build .sub{left:0;right:0;bottom:66px;text-align:center;font-size:37px;font-weight:600;letter-spacing:-.01em}
#r-build .sub span{background:rgba(10,10,11,.9);padding:11px 26px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.75}
#r-build .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:22px;letter-spacing:.05em;
  padding:8px 15px;border-radius:6px}
#r-build .ttl{font-size:180px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="r-build" data-composition-id="r-build" data-width="1920" data-height="1080" data-start="0" data-duration="6">
<div class="clip bg" id="r-build-bg" data-start="0" data-duration="6" data-track-index="0"></div>
<div class="clip bg" id="bgx" data-start="0" data-duration="6" data-track-index="1"></div><div class="clip tag" id="tg" style="left:5.5%;top:7%" data-start="0" data-duration="6" data-track-index="3">MAKING THE LOOMPAD</div>
<div class="clip sub" id="sb0" data-start="0" data-duration="6" data-track-index="40"><span>We built the hardware too.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="6" data-track-index="41"><span>Printed, wired, assembled.</span></div>
<div class="clip sub" id="sb2" data-start="0" data-duration="6" data-track-index="42"><span>A macropad with one key per agent.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["r-build"]=tl;
gsap.set('#tg',{opacity:0,scale:.94});tl.to('#tg',{opacity:1,scale:1,duration:.24,ease:"back.out(3)"},.2);

gsap.set('#sb0',{opacity:0,y:14});
tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.12);
tl.to('#sb0',{opacity:0,duration:.14},1.96);
gsap.set('#sb1',{opacity:0,y:14});
tl.to('#sb1',{opacity:1,y:0,duration:.2,ease:"power2.out"},2.12);
tl.to('#sb1',{opacity:0,duration:.14},3.96);
gsap.set('#sb2',{opacity:0,y:14});
tl.to('#sb2',{opacity:1,y:0,duration:.2,ease:"power2.out"},4.12);
tl.to('#sb2',{opacity:0,duration:.14},5.96);})();</script></body></html>
