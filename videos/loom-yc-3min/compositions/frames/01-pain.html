<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#s01-pain{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#s01-pain .clip{position:absolute}
#s01-pain .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#s01-pain .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#s01-pain .mono{font-family:"LoomMono",monospace}
/* the callout: a hairline orange box that draws itself around a real UI region */
#s01-pain .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#s01-pain .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
/* the lower band: one line of chrome that never fights the UI above it */
#s01-pain .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#s01-pain .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em}
#s01-pain .bandsub{font-size:21px;color:#A1A1AA}
#s01-pain .rule{background:#FF6B2B;height:3px}
</style>
</head>
<body>
<div id="s01-pain" data-composition-id="s01-pain" data-width="1920" data-height="1080"
  data-start="0" data-duration="11">
<div class="clip bg" id="s01-pain-bg" data-start="0" data-duration="11" data-track-index="0"></div>
<img class="clip shot" id="p-img" src="assets/cards/scene01-pain.png" data-start="0" data-duration="11" data-track-index="1">
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["s01-pain"] = tl;
  var R = function(s){ return document.querySelector('#s01-pain ' + s); };
  var RA = function(s){ return Array.prototype.slice.call(document.querySelectorAll('#s01-pain ' + s)); };
  gsap.set('#p-img', {scale:1.02});
  tl.to('#p-img', {scale:1.1, duration:11, ease:"none"}, 0);

})();
</script>
</body></html>
