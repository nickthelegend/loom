<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#s03-prompt{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#s03-prompt .clip{position:absolute}
#s03-prompt .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#s03-prompt .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#s03-prompt .mono{font-family:"LoomMono",monospace}
/* the callout: a hairline orange box that draws itself around a real UI region */
#s03-prompt .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#s03-prompt .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
/* the lower band: one line of chrome that never fights the UI above it */
#s03-prompt .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#s03-prompt .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em}
#s03-prompt .bandsub{font-size:21px;color:#A1A1AA}
#s03-prompt .rule{background:#FF6B2B;height:3px}
</style>
</head>
<body>
<div id="s03-prompt" data-composition-id="s03-prompt" data-width="1920" data-height="1080"
  data-start="0" data-duration="11.2">
<div class="clip bg" id="s03-prompt-bg" data-start="0" data-duration="11.2" data-track-index="0"></div>
<img class="clip shot" id="q-img" src="assets/shots/001-prompt-typed.png" data-start="0" data-duration="11.2" data-track-index="1">
    <div class="clip call" id="q-call" style="left:14.5%;top:80.5%;width:63%;height:9%" data-start="0" data-duration="11.2" data-track-index="4"></div>
    <div class="clip tag" id="q-tag" style="left:14.5%;top:75.5%" data-start="0" data-duration="11.2" data-track-index="5">A REAL PROMPT</div>
    <div class="clip band" id="band" data-start="0" data-duration="99" data-track-index="6">
     <div class="bandttl" style="color:#FF6B2B">ONE THREAD</div>
     <div class="bandsub mono">you type once — Loom decides who runs it</div>
   </div>
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["s03-prompt"] = tl;
  var R = function(s){ return document.querySelector('#s03-prompt ' + s); };
  var RA = function(s){ return Array.prototype.slice.call(document.querySelectorAll('#s03-prompt ' + s)); };
  gsap.set('#q-img', {scale:1});
  tl.to('#q-img', {scale:1.05, duration:11.2, ease:"none"}, 0);
  gsap.set('#q-call', {opacity:0, scale:0.94});
  tl.to('#q-call', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 1.5);
  tl.to('#q-call', {opacity:0, duration:0.28, ease:"power2.in"}, 7.7);
  gsap.set('#q-tag', {opacity:0, scale:0.94});
  tl.to('#q-tag', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 1.6);
  tl.to('#q-tag', {opacity:0, duration:0.28, ease:"power2.in"}, 7.699999999999999);
  gsap.set('.band', {opacity:0, y:26});
  tl.to('.band', {opacity:1, y:0, duration:0.42, ease:"back.out(1.7)"}, 0.5);

})();
</script>
</body></html>
