<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#s08-pad{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#s08-pad .clip{position:absolute}
#s08-pad .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#s08-pad .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#s08-pad .mono{font-family:"LoomMono",monospace}
/* the callout: a hairline orange box that draws itself around a real UI region */
#s08-pad .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#s08-pad .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
/* the lower band: one line of chrome that never fights the UI above it */
#s08-pad .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#s08-pad .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em}
#s08-pad .bandsub{font-size:21px;color:#A1A1AA}
#s08-pad .rule{background:#FF6B2B;height:3px}
</style>
</head>
<body>
<div id="s08-pad" data-composition-id="s08-pad" data-width="1920" data-height="1080"
  data-start="0" data-duration="35">
<div class="clip bg" id="s08-pad-bg" data-start="0" data-duration="35" data-track-index="0"></div>
<video class="clip shot" id="pad-v" src="assets/video/loompad-usage.mp4" muted playsinline preload="auto"
      data-start="0" data-duration="35" data-media-start="0" data-track-index="1"></video>
    <div class="clip tag" id="pad-t1" style="left:6%;top:8%" data-start="0" data-duration="35" data-track-index="4">ITS OWN WI-FI · LoomPad-Setup</div>
    <div class="clip tag" id="pad-t2" style="left:6%;top:8%" data-start="0" data-duration="35" data-track-index="5">ONE KEY PER AGENT</div>
    <div class="clip tag" id="pad-t3" style="left:6%;top:8%" data-start="0" data-duration="35" data-track-index="6">PRESS · THE FLEET ANSWERS</div>
    <div class="clip band" id="band" data-start="0" data-duration="99" data-track-index="7">
     <div class="bandttl" style="color:#FF6B2B">THE LOOMPAD</div>
     <div class="bandsub mono">open hardware · printable · ESP32-S3</div>
   </div>
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["s08-pad"] = tl;
  var R = function(s){ return document.querySelector('#s08-pad ' + s); };
  var RA = function(s){ return Array.prototype.slice.call(document.querySelectorAll('#s08-pad ' + s)); };
  gsap.set('#pad-t1',{opacity:0}); gsap.set('#pad-t2',{opacity:0}); gsap.set('#pad-t3',{opacity:0});
  gsap.set('.band', {opacity:0, y:26});
  tl.to('.band', {opacity:1, y:0, duration:0.42, ease:"back.out(1.7)"}, 0.6);
  gsap.set('#pad-t1', {opacity:0, scale:0.94});
  tl.to('#pad-t1', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 1.2);
  tl.to('#pad-t1', {opacity:0, duration:0.28, ease:"power2.in"}, 6.2);
  gsap.set('#pad-t2', {opacity:0, scale:0.94});
  tl.to('#pad-t2', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 12);
  tl.to('#pad-t2', {opacity:0, duration:0.28, ease:"power2.in"}, 18);
  gsap.set('#pad-t3', {opacity:0, scale:0.94});
  tl.to('#pad-t3', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 24);
  tl.to('#pad-t3', {opacity:0, duration:0.28, ease:"power2.in"}, 31);

})();
</script>
</body></html>
