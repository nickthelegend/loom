<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#s04-handoff{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#s04-handoff .clip{position:absolute}
#s04-handoff .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#s04-handoff .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#s04-handoff .mono{font-family:"LoomMono",monospace}
/* the callout: a hairline orange box that draws itself around a real UI region */
#s04-handoff .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#s04-handoff .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
/* the lower band: one line of chrome that never fights the UI above it */
#s04-handoff .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#s04-handoff .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em}
#s04-handoff .bandsub{font-size:21px;color:#A1A1AA}
#s04-handoff .rule{background:#FF6B2B;height:3px}
</style>
</head>
<body>
<div id="s04-handoff" data-composition-id="s04-handoff" data-width="1920" data-height="1080"
  data-start="0" data-duration="14">
<div class="clip bg" id="s04-handoff-bg" data-start="0" data-duration="14" data-track-index="0"></div>
<img class="clip shot" id="h-img" src="assets/shots/000-thread-real-route.png" data-start="0" data-duration="14" data-track-index="1">
    <div class="clip call" id="h-c1" style="left:31%;top:20%;width:44%;height:7%" data-start="0" data-duration="14" data-track-index="4"></div>
    <div class="clip tag" id="h-t1" style="left:31%;top:14.5%" data-start="0" data-duration="14" data-track-index="5">STEP 1 · PLANNER</div>
    <div class="clip call" id="h-c2" style="left:31%;top:46%;width:44%;height:6%" data-start="0" data-duration="14" data-track-index="6"></div>
    <div class="clip tag" id="h-t2" style="left:31%;top:40.5%" data-start="0" data-duration="14" data-track-index="7">BATON → CODEX</div>
    <div class="clip band" id="band" data-start="0" data-duration="99" data-track-index="8">
     <div class="bandttl" style="color:#FF6B2B">PLAN → EXECUTE</div>
     <div class="bandsub mono">the context goes with the baton</div>
   </div>
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["s04-handoff"] = tl;
  var R = function(s){ return document.querySelector('#s04-handoff ' + s); };
  var RA = function(s){ return Array.prototype.slice.call(document.querySelectorAll('#s04-handoff ' + s)); };
  gsap.set('#h-img', {scale:1});
  tl.to('#h-img', {scale:1.07, duration:14, ease:"none"}, 0);
  gsap.set('#h-c1', {opacity:0, scale:0.94});
  tl.to('#h-c1', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 1.2);
  tl.to('#h-c1', {opacity:0, duration:0.28, ease:"power2.in"}, 4.8);
  gsap.set('#h-t1', {opacity:0, scale:0.94});
  tl.to('#h-t1', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 1.3);
  tl.to('#h-t1', {opacity:0, duration:0.28, ease:"power2.in"}, 4.8);
  gsap.set('#h-c2', {opacity:0, scale:0.94});
  tl.to('#h-c2', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 6.4);
  tl.to('#h-c2', {opacity:0, duration:0.28, ease:"power2.in"}, 10.8);
  gsap.set('#h-t2', {opacity:0, scale:0.94});
  tl.to('#h-t2', {opacity:1, scale:1, duration:0.34, ease:"back.out(2)"}, 6.5);
  tl.to('#h-t2', {opacity:0, duration:0.28, ease:"power2.in"}, 10.8);
  gsap.set('.band', {opacity:0, y:26});
  tl.to('.band', {opacity:1, y:0, duration:0.42, ease:"back.out(1.7)"}, 0.4);

})();
</script>
</body></html>
