<!doctype html><html><head><meta charset="utf-8">

<style>

@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#t-board{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}

#t-board .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#t-board .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#t-board .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>

   <div class="clip tag" id="tg" style="left:5%;top:6.5%" data-start="0" data-duration="5.4" data-track-index="3">THE BOARD</div>

<div class="clip call" id="cl1" style="left:35%;top:16%;width:20%;height:20%" data-start="0" data-duration="5.4" data-track-index="11"></div>
<div class="clip call" id="cl2" style="left:57%;top:16%;width:20%;height:18%" data-start="0" data-duration="5.4" data-track-index="12"></div>

</div>
