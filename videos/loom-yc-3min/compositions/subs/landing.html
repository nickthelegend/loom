<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#k-landing{position:absolute;inset:0;overflow:hidden;background:#00FF00;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#k-landing .clip{position:absolute}
#k-landing .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
/* Opaque, unlike the base pass. A translucent plate lets the key colour through
   it, and 8% of pure green over near-black is a visibly green caption box. */
#k-landing .sub span{background:#0A0A0B;padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#k-landing .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:21px;letter-spacing:.05em;padding:8px 14px;border-radius:6px;white-space:nowrap}
</style></head><body>
<div id="k-landing" data-composition-id="k-landing" data-width="1920" data-height="1080" data-start="0" data-duration="9">
<div class="clip sub" id="sb0" data-start="0" data-duration="9" data-track-index="40"><span>One device that speaks to every agent you use.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="9" data-track-index="41"><span>Buy one soon, or build one yourself.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});
window.__timelines["k-landing"]=tl;
gsap.set('#sb0',{opacity:0,y:14});tl.to('#sb0',{opacity:1,y:0,duration:.18,ease:"power2.out"},0.03);tl.to('#sb0',{opacity:0,duration:.14},2.99);
gsap.set('#sb1',{opacity:0,y:14});tl.to('#sb1',{opacity:1,y:0,duration:.18,ease:"power2.out"},2.97);tl.to('#sb1',{opacity:0,duration:.14},8.4);})();</script></body></html>
