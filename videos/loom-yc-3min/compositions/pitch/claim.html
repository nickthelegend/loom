<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#pt-claim{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#pt-claim .clip{position:absolute}
#pt-claim .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#pt-claim .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#pt-claim .mono{font-family:"LoomMono",monospace}
#pt-claim .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#pt-claim .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
#pt-claim .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#pt-claim .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em;color:#FF6B2B}
#pt-claim .bandsub{font-size:21px;color:#A1A1AA}
</style>
</head><body>
<div id="pt-claim" data-composition-id="pt-claim" data-width="1920" data-height="1080" data-start="0" data-duration="2">
<div class="clip bg" id="pt-claim-bg" data-start="0" data-duration="2" data-track-index="0"></div>
<img class="clip shot" id="a" src="assets/cards/scene02-claim.png" data-start="0" data-duration="2" data-track-index="1">
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["pt-claim"] = tl;
  gsap.set('#a',{scale:1});
  tl.to('#a',{scale:1.09,duration:2,ease:"none"},0);

})();
</script>
</body></html>
