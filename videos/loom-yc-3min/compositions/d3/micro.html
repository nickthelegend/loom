<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#d-micro{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#d-micro .clip{position:absolute}
#d-micro .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#d-micro .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#d-micro .m{font-family:"LoomMono",monospace}
#d-micro .lg{width:120px;height:120px;object-fit:contain}
#d-micro .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#d-micro .call{border:2.5px solid #FF6B2B;border-radius:9px;box-shadow:0 0 0 9999px rgba(10,10,11,.5)}
#d-micro .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:21px;letter-spacing:.05em;padding:8px 14px;border-radius:6px;white-space:nowrap}
#d-micro .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#d-micro .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#d-micro .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="d-micro" data-composition-id="d-micro" data-width="1920" data-height="1080" data-start="0" data-duration="4.6">
<div class="clip bg" id="d-micro-bg" data-start="0" data-duration="4.6" data-track-index="0"></div>
<div class="clip" id="mw" data-start="0" data-duration="4.6" data-track-index="1" style="left:0;right:0;top:400px;text-align:center;font-size:86px;font-weight:700;letter-spacing:-.03em">a Codex Micro<br><span style="color:#FF6B2B">for every agent</span></div>
<div class="clip sub" id="sb0" data-start="0" data-duration="4.6" data-track-index="40"><span>A Codex Micro — for every agent, in one device.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["d-micro"]=tl;
gsap.set('#mw',{opacity:0,scale:.9});tl.to('#mw',{opacity:1,scale:1,duration:.45,ease:"back.out(2.2)"},0);
gsap.set('#sb0',{opacity:0,y:14});tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.1);tl.to('#sb0',{opacity:0,duration:.13},4.55);})();</script></body></html>
