<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#d-taskmove{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#d-taskmove .clip{position:absolute}
#d-taskmove .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#d-taskmove .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#d-taskmove .m{font-family:"LoomMono",monospace}
#d-taskmove .lg{width:120px;height:120px;object-fit:contain}
#d-taskmove .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#d-taskmove .call{border:2.5px solid #FF6B2B;border-radius:9px;box-shadow:0 0 0 9999px rgba(10,10,11,.5)}
#d-taskmove .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:21px;letter-spacing:.05em;padding:8px 14px;border-radius:6px;white-space:nowrap}
#d-taskmove .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#d-taskmove .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#d-taskmove .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="d-taskmove" data-composition-id="d-taskmove" data-width="1920" data-height="1080" data-start="0" data-duration="6.8">
<div class="clip bg" id="d-taskmove-bg" data-start="0" data-duration="6.8" data-track-index="0"></div>
<img class="clip sh" id="im" src="assets/shots/03-board-after.png" data-start="0" data-duration="6.8" data-track-index="1">
   <div class="clip tag" id="tg" style="left:5%;top:6.5%" data-start="0" data-duration="6.8" data-track-index="3">THE TASK MOVED ITSELF</div>
   <div class="clip call" id="cl0" style="left:50%;top:16%;width:21%;height:22%" data-start="0" data-duration="6.8" data-track-index="10"></div>
<div class="clip sub" id="sb0" data-start="0" data-duration="6.8" data-track-index="40"><span>Every task carries the agent that owns it.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="6.8" data-track-index="41"><span>When an agent finishes, the task moves itself.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["d-taskmove"]=tl;
gsap.set('#im',{scale:1.34,xPercent:4,yPercent:2});tl.to('#im',{scale:1.24,xPercent:-4,yPercent:2,duration:6.8,ease:"power1.inOut"},0);gsap.set('#tg',{opacity:0,scale:.94});tl.to('#tg',{opacity:1,scale:1,duration:.26,ease:"back.out(3)"},.2);gsap.set('#cl0',{opacity:0,scale:.93});tl.to('#cl0',{opacity:1,scale:1,duration:.3,ease:"back.out(2.6)"},1.8);tl.to('#cl0',{opacity:0,duration:.24},5.4);
gsap.set('#sb0',{opacity:0,y:14});tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.1);tl.to('#sb0',{opacity:0,duration:.13},3.35);
gsap.set('#sb1',{opacity:0,y:14});tl.to('#sb1',{opacity:1,y:0,duration:.2,ease:"power2.out"},3.5);tl.to('#sb1',{opacity:0,duration:.13},6.75);})();</script></body></html>
