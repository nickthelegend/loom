<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#d-circuits{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#d-circuits .clip{position:absolute}
#d-circuits .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#d-circuits .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#d-circuits .m{font-family:"LoomMono",monospace}
#d-circuits .lg{width:120px;height:120px;object-fit:contain}
#d-circuits .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#d-circuits .call{border:2.5px solid #FF6B2B;border-radius:9px;box-shadow:0 0 0 9999px rgba(10,10,11,.5)}
#d-circuits .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:21px;letter-spacing:.05em;padding:8px 14px;border-radius:6px;white-space:nowrap}
#d-circuits .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#d-circuits .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#d-circuits .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="d-circuits" data-composition-id="d-circuits" data-width="1920" data-height="1080" data-start="0" data-duration="15.1">
<div class="clip bg" id="d-circuits-bg" data-start="0" data-duration="15.1" data-track-index="0"></div>
<div class="clip bg" id="cb" data-start="0" data-duration="15.1" data-track-index="1"></div>
   <div class="clip tag" id="tg" style="left:5%;top:6.5%" data-start="0" data-duration="15.1" data-track-index="3">OPEN SOURCE &mdash; SCHEMATIC, WIRING, CAD</div>
<div class="clip sub" id="sb0" data-start="0" data-duration="15.1" data-track-index="40"><span>The whole project is open source.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="15.1" data-track-index="41"><span>Enclosure, wiring, the full schematic.</span></div>
<div class="clip sub" id="sb2" data-start="0" data-duration="15.1" data-track-index="42"><span>Print one, wire it, and it is yours.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["d-circuits"]=tl;
gsap.set('#tg',{opacity:0,scale:.94});tl.to('#tg',{opacity:1,scale:1,duration:.26,ease:"back.out(3)"},.3);tl.to('#tg',{opacity:0,duration:.3},7.5);
gsap.set('#sb0',{opacity:0,y:14});tl.to('#sb0',{opacity:1,y:0,duration:.18,ease:"power2.out"},0.03);tl.to('#sb0',{opacity:0,duration:.14},2.28);
gsap.set('#sb1',{opacity:0,y:14});tl.to('#sb1',{opacity:1,y:0,duration:.18,ease:"power2.out"},2.26);tl.to('#sb1',{opacity:0,duration:.14},4.85);
gsap.set('#sb2',{opacity:0,y:14});tl.to('#sb2',{opacity:1,y:0,duration:.18,ease:"power2.out"},4.83);tl.to('#sb2',{opacity:0,duration:.14},10.38);})();</script></body></html>
