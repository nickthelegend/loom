<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#f-prompt{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#f-prompt .clip{position:absolute}
#f-prompt .bg{inset:0;width:100%;height:100%;background:#0A0A0B}

#f-prompt .m{font-family:"LoomMono",monospace}
#f-prompt .lg{width:120px;height:120px;object-fit:contain}
#f-prompt .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#f-prompt .call{border:2.5px solid #FF6B2B;border-radius:9px;box-shadow:0 0 0 9999px rgba(10,10,11,.5)}

#f-prompt .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#f-prompt .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#f-prompt .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="f-prompt" data-composition-id="f-prompt" data-width="1920" data-height="1080" data-start="0" data-duration="11">

<img class="clip sh" id="im" src="assets/shots/001-prompt-typed.png" data-start="0" data-duration="11" data-track-index="1">
   <div class="clip tag" id="tg" style="left:5%;top:6.5%" data-start="0" data-duration="11" data-track-index="3">THE REAL APP</div>

<div class="clip sub" id="sb0" data-start="0" data-duration="11" data-track-index="40"><span>One prompt, into one shared thread.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="11" data-track-index="41"><span>Loom picks who takes it,</span></div>
<div class="clip sub" id="sb2" data-start="0" data-duration="11" data-track-index="42"><span>and the agent starts with the whole project in its head.</span></div>
</div>
