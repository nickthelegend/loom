<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#f-pad{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#f-pad .clip{position:absolute}
#f-pad .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#f-pad .sh{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#f-pad .m{font-family:"LoomMono",monospace}
#f-pad .lg{width:120px;height:120px;object-fit:contain}
#f-pad .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#f-pad .call{border:2.5px solid #FF6B2B;border-radius:9px;box-shadow:0 0 0 9999px rgba(10,10,11,.5)}
#f-pad .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:21px;letter-spacing:.05em;padding:8px 14px;border-radius:6px;white-space:nowrap}
#f-pad .sub{left:0;right:0;bottom:58px;text-align:center;font-size:36px;font-weight:600}
#f-pad .sub span{background:rgba(10,10,11,.9);padding:10px 25px;border-radius:9px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.8}
#f-pad .ttl{font-size:185px;font-weight:700;letter-spacing:-.05em;text-align:center;left:0;right:0}
</style></head><body>
<div id="f-pad" data-composition-id="f-pad" data-width="1920" data-height="1080" data-start="0" data-duration="22">
<div class="clip bg" id="f-pad-bg" data-start="0" data-duration="22" data-track-index="0"></div>
<div class="clip bg" id="pb" data-start="0" data-duration="22" data-track-index="1"></div>
   <div class="clip tag" id="tg" style="left:5%;top:6.5%" data-start="0" data-duration="22" data-track-index="3">THE LOOMPAD &mdash; REAL HARDWARE</div>
<div class="clip sub" id="sb0" data-start="0" data-duration="22" data-track-index="40"><span>And we built the hardware.</span></div>
<div class="clip sub" id="sb1" data-start="0" data-duration="22" data-track-index="41"><span>An open macropad — one key per agent.</span></div>
</div>
<script>(function(){window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});window.__timelines["f-pad"]=tl;
gsap.set('#tg',{opacity:0,scale:.94});tl.to('#tg',{opacity:1,scale:1,duration:.26,ease:"back.out(3)"},.3);tl.to('#tg',{opacity:0,duration:.3},6.5);
gsap.set('#sb0',{opacity:0,y:14});tl.to('#sb0',{opacity:1,y:0,duration:.2,ease:"power2.out"},0.1);tl.to('#sb0',{opacity:0,duration:.13},10.95);
gsap.set('#sb1',{opacity:0,y:14});tl.to('#sb1',{opacity:1,y:0,duration:.2,ease:"power2.out"},11.1);tl.to('#sb1',{opacity:0,duration:.13},21.95);})();</script></body></html>
