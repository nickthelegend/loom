<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#sh-pad{position:absolute;inset:0;overflow:hidden;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#sh-pad .clip{position:absolute}
#sh-pad .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#sh-pad .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#sh-pad .mono{font-family:"LoomMono",monospace}
#sh-pad .call{border:2px solid #FF6B2B;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,10,11,.55)}
#sh-pad .tag{background:#FF6B2B;color:#0A0A0B;font-weight:700;font-size:20px;letter-spacing:.06em;
  padding:7px 13px;border-radius:6px;white-space:nowrap}
#sh-pad .band{left:0;right:0;bottom:0;height:104px;background:linear-gradient(0deg,rgba(10,10,11,.97),rgba(10,10,11,.86) 62%,transparent);
  display:flex;align-items:center;justify-content:center;gap:26px}
#sh-pad .bandttl{font-size:27px;font-weight:700;letter-spacing:.03em;color:#FF6B2B}
#sh-pad .bandsub{font-size:21px;color:#A1A1AA}
</style>
</head><body>
<div id="sh-pad" data-composition-id="sh-pad" data-width="1920" data-height="1080" data-start="0" data-duration="3.4">
<div class="clip bg" id="sh-pad-bg" data-start="0" data-duration="3.4" data-track-index="0"></div>
<video class="clip shot" id="a" src="assets/video/loompad-short.mp4" muted playsinline preload="auto"
        data-start="0" data-duration="3.4" data-media-start="0" data-track-index="1"></video>
      <div class="clip band" id="band" data-start="0" data-duration="99" data-track-index="8">
   <div class="bandttl">THE LOOMPAD</div><div class="bandsub mono">one key per agent · open hardware</div></div>
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused:true});
  window.__timelines["sh-pad"] = tl;
  gsap.set('.band',{opacity:0,y:26});
  tl.to('.band',{opacity:1,y:0,duration:0.34,ease:"back.out(1.7)"},0.20);

})();
</script>
</body></html>
