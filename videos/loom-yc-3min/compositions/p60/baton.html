<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"SG";src:url("assets/Space_Grotesk_Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"LoomMono";src:local("Menlo"),local("SF Mono"),local("Monaco");font-display:block}
#x-baton{position:absolute;inset:0;overflow:hidden;background:#0A0A0B;font-family:"SG",system-ui,sans-serif;color:#FAFAFA}
#x-baton .clip{position:absolute}
#x-baton .bg{inset:0;width:100%;height:100%;background:#0A0A0B}
#x-baton .m{font-family:"LoomMono",monospace}
#x-baton .lg{width:118px;height:118px;object-fit:contain}
#x-baton .card{border:1px solid #26262B;border-radius:14px;background:#0e0e11}
#x-baton .ttl{font-size:52px;font-weight:700;letter-spacing:-.02em}
#x-baton .sub{font-size:24px;color:#A1A1AA}
#x-baton .chip{border:1px solid #26262B;border-radius:99px;padding:9px 20px;font-size:20px;color:#A1A1AA;background:#111116}
#x-baton .baton{width:22px;height:22px;border-radius:50%;background:#FF6B2B;box-shadow:0 0 26px 8px rgba(255,107,43,.55)}
#x-baton .wire{height:2px;background:linear-gradient(90deg,#26262B,#FF6B2B,#26262B)}
#x-baton .tcard{border:1px solid #26262B;border-left:3px solid #FF6B2B;border-radius:10px;background:#101014;
  padding:14px 16px;font-size:19px;display:flex;align-items:center;gap:11px}
#x-baton .tcard img{width:24px;height:24px;object-fit:contain}
#x-baton .col{font-size:16px;letter-spacing:.13em;color:#A1A1AA;text-transform:uppercase}
#x-baton .unit{border:1px solid #26262B;border-radius:10px;background:#101014;padding:12px 15px;font-size:18px;
  display:flex;align-items:center;gap:10px;white-space:nowrap}
#x-baton .unit img{width:21px;height:21px;object-fit:contain}
#x-baton .kind{font-size:12px;letter-spacing:.1em;padding:3px 8px;border-radius:5px;background:#1c1c22;color:#A1A1AA}
#x-baton .shot{inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#x-baton .band{left:0;right:0;bottom:0;height:96px;background:linear-gradient(0deg,rgba(10,10,11,.97),transparent);
  display:flex;align-items:center;justify-content:center;gap:22px}
#x-baton .bt{font-size:26px;font-weight:700;color:#FF6B2B} #x-baton .bs{font-size:20px;color:#A1A1AA}
</style></head><body>
<div id="x-baton" data-composition-id="x-baton" data-width="1920" data-height="1080" data-start="0" data-duration="6.5">
<div class="clip bg" id="x-baton-bg" data-start="0" data-duration="6.5" data-track-index="0"></div>
<div class="clip" data-start="0" data-duration="6.5" data-track-index="1" style="inset:0">
    <div class="col" style="position:absolute;left:0;top:150px;width:1920px;text-align:center">pass the baton</div>
    <img class="lg" src="assets/logos/logo-claude-code.png" style="position:absolute;left:270px;top:400px">
    <div class="m" style="position:absolute;left:180px;top:540px;width:300px;text-align:center;font-size:22px;color:#A1A1AA">claude-code</div>
    <div class="m" style="position:absolute;left:180px;top:576px;width:300px;text-align:center;font-size:16px;color:#5a5a63">planner</div>
    <img class="lg" src="assets/logos/logo-codex.png" style="position:absolute;left:1530px;top:400px">
    <div class="m" style="position:absolute;left:1440px;top:540px;width:300px;text-align:center;font-size:22px;color:#A1A1AA">codex</div>
    <div class="m" style="position:absolute;left:1440px;top:576px;width:300px;text-align:center;font-size:16px;color:#5a5a63">builder</div>
    <div class="wire" id="b-wire" style="position:absolute;left:470px;top:458px;width:0"></div>
    <div class="baton" id="b-tok" style="position:absolute;left:462px;top:448px"></div>
    <div class="chip" id="b-c1" style="position:absolute;left:560px;top:640px">decisions</div>
    <div class="chip" id="b-c2" style="position:absolute;left:800px;top:640px">memory</div>
    <div class="chip" id="b-c3" style="position:absolute;left:1030px;top:640px">the whole thread</div>
    <div class="m" id="b-done" style="position:absolute;left:0;top:780px;width:1920px;text-align:center;font-size:30px;color:#FF6B2B;opacity:0">picks up mid-task &mdash; nothing re-explained</div>
  </div>
</div>
<script>(function(){
window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});
window.__timelines["x-baton"]=tl;
gsap.set(['#b-c1','#b-c2','#b-c3'],{opacity:0,y:16});
tl.to('#b-wire',{width:1060,duration:.7,ease:"power2.out"},.2)
  .to(['#b-c1','#b-c2','#b-c3'],{opacity:1,y:0,duration:.3,stagger:.16,ease:"back.out(2)"},.7)
  .to('#b-tok',{x:1062,duration:1.5,ease:"power2.inOut"},1.6)
  .to(['#b-c1','#b-c2','#b-c3'],{x:640,duration:1.5,ease:"power2.inOut"},1.7)
  .to(['#b-c1','#b-c2','#b-c3'],{opacity:0,duration:.3},3.2)
  .to('#b-done',{opacity:1,duration:.35,ease:"back.out(1.6)"},3.5);})();</script></body></html>
