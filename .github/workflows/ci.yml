name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise migrations in a disposable database, never against hosted state.
  # initdb is installed on this image but its bin directory is not on PATH.
  hub-sql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable installed PostgreSQL tools
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          test -x "$PG_BINDIR/initdb"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"
      - run: npx vitest run test/supabase-sql.test.ts --reporter=verbose
        env:
          LOOM_REQUIRE_POSTGRES: "1"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        terminal: [pty, pipe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Isolate terminal modes on separate runners so Windows can serialize
      # test files without doubling one job's time. Both run the full suite.
      # node-pty ships no Linux prebuild, so this runner compiles it — and
      # because it's an optionalDependency, a failed build is silent. Without
      # LOOM_EXPECT_PTY the pty tests would skip themselves and the whole
      # backend would ship untested behind a green board, so assert it here.
      - run: npm test
        env:
          LOOM_NO_NOTIFY: "1"
          LOOM_EXPECT_PTY: ${{ matrix.terminal == 'pty' && '1' || '' }}
          LOOM_NO_PTY: ${{ matrix.terminal == 'pipe' && '1' || '' }}

  # The phone app has its own dependency tree and never gets built by the job
  # above, so nothing here noticed when it broke. It can't be rendered in CI —
  # this at least keeps it compiling against the daemon's types.
  #
  # Keep the phone dependency tree reproducible on npm 10 as well as npm 11.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      # The phone carries copies of the relay protocol; they must match the daemon's.
      - run: node app/scripts/check-relay-copies.mjs
      # The pure logic behind the phone's team tabs (node's own test runner).
      - run: npm test
        working-directory: app

  # The runner image (Loom Teams D78): proves Dockerfile.runner builds and the
  # CLI inside it runs. The build machine behind this repo has no Docker, so CI
  # is where the image is actually exercised.
  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.runner -t loom-runner .
      - name: The CLI inside runs, as the unprivileged user, with its own home
        run: |
          docker run --rm loom-runner loom --version
          docker run --rm loom-runner sh -c 'test "$(id -un)" = loom && test "$LOOM_HOME" = /loom && gh --version | head -1'
      - name: The daemon starts and answers health
        run: |
          docker run -d --name loom-runner-smoke -p 7420:7420 loom-runner
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7420/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:7420/api/health
          docker rm -f loom-runner-smoke
