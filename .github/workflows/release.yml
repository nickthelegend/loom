# Build every native artifact on its own native runner, then publish them all to
# a real GitHub Release.
#
# The previous version built the installers and left them as workflow artifacts,
# which expire and are only reachable from the Actions tab by someone signed in.
# That is not a release: a person who wants to run Loom should land on the
# Releases page and find a file they can double-click. The `publish` job below
# is the part that was missing.
#
# Cross-compiling was tried and abandoned — electron-builder's app-builder
# segfaults under QEMU when targeting amd64 from an Apple-Silicon host — so each
# platform builds on its own runner. Slower, and the only path that reliably
# produces all of them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload its assets

jobs:
  desktop:
    name: desktop · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures come off the Apple Silicon runner in one
          # pass. electron-builder downloads the x64 Electron and packages it
          # natively — verified locally, producing a 115 MB arm64 dmg and a
          # 120 MB x64 dmg side by side. The dedicated Intel runner (macos-13)
          # was dropped because it sat queued for scarce capacity, and `publish`
          # waits on every desktop job: one starved runner meant no release at
          # all. (This is not the QEMU problem noted above — that is about
          # building *Linux/Windows* from macOS, which still needs its own host.)
          - os: macos-14
            label: macOS (arm64 + x64)
            args: --mac dmg --arm64 --x64
          - os: windows-latest
            label: Windows x64
            args: --win nsis --x64
          - os: ubuntu-latest
            label: Linux x64
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the daemon
        run: |
          npm ci
          npm run build
      # `npm install`, not `npm ci`, and deliberately so: electron-builder pulls
      # platform-gated optional dependencies (squirrel-windows on Windows,
      # dmg-license on macOS), and npm only records the ones resolvable on the
      # machine that wrote the lockfile. One committed lock therefore cannot
      # satisfy `npm ci` on four different runners — it fails with "Missing:
      # electron-builder-squirrel-windows from lock file" on Linux and Windows.
      # The daemon above still uses `npm ci`, where the lock is honest.
      - name: Build the installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run stage
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: loom-desktop-${{ matrix.os }}
          # A silent empty artifact is how a release ships with nothing in it.
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            # The update feed electron-updater reads. Windows and the Linux
            # AppImage can replace themselves; macOS can't until the build is
            # signed by a certificate the OS trusts, so latest-mac.yml is
            # deliberately NOT collected below — advertising an update an app
            # will refuse to install is worse than not advertising it.
            desktop/dist/latest*.yml

  android:
    name: android · apk
    runs-on: ubuntu-latest
    env:
      # `secrets` can't be read from a step-level `if`, so the decision is made
      # once here and compared as a plain string below.
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The default package list includes "tools", which current SDK command-line
      # tools no longer ship ("Failed to find package 'tools'" failed the job);
      # the runner's preinstalled SDK has the rest.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Signed cloud build when the repo has an Expo token. `--wait` on purpose:
      # --no-wait returns before the binary exists, so there would be nothing to
      # attach to the release.
      - name: EAS build (signed)
        if: env.HAS_EXPO == 'yes'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: app
        run: |
          npm ci
          npx eas-cli build -p android --profile preview --non-interactive --wait
          npx eas-cli build:download --platform android --latest --output "$GITHUB_WORKSPACE/loompad.apk"

      # Otherwise a local release build, signed with the project's own release
      # key. It used to be `assembleDebug`, which never bundles the JavaScript —
      # the v0.2.0 apk had no index.android.bundle and would only open against a
      # dev server. A release build carries its bundle; the key (a GitHub secret)
      # keeps every future apk installable as an update of this one.
      - name: Local gradle release build (release-signed)
        if: env.HAS_EXPO == 'no'
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "no ANDROID_KEYSTORE_BASE64 secret — refusing to ship an unsigned or debug apk"; exit 1; }
          npm install --no-audit --no-fund
          npx expo prebuild -p android --no-install
          (cd android && ./gradlew assembleRelease --no-daemon)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "gradle produced no release apk"; exit 1; }
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || { echo "the apk has no JavaScript bundle"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$GITHUB_WORKSPACE/loompad.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/loompad.apk" | grep -E "Verified using|Signer #1 certificate SHA-256"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name it after the release
        run: |
          test -f loompad.apk || { echo "no apk was produced"; exit 1; }
          V="${GITHUB_REF_NAME#v}"
          V="${V//\//-}"   # a dry run from a branch like ci/x must still make a valid file name
          mv loompad.apk "loompad-${V}-android.apk"
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: loom-android-apk
          if-no-files-found: error
          path: "*.apk"

  publish:
    name: publish the release
    needs: [desktop, android]
    # A manual run without a tag is a dry run that proves the artifacts still
    # build; only a tag actually publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) \
            -exec cp {} out/ \;
          # The feed, for the platforms whose app may replace itself.
          find artifacts -type f \
            \( -name "latest.yml" -o -name "latest-linux.yml" \) \
            -exec cp {} out/ \;
          cd out
          ls -la
          test -n "$(ls -A)" || { echo "nothing to publish"; exit 1; }
          # The release is unsigned; saying so with numbers a person can verify
          # beats saying nothing. The feed files carry their own hashes and are
          # read by machines, so they stay out of the human checksum list.
          # A loop, not `sha256sum $(ls …)`: installer names contain spaces.
          for f in *; do
            case "$f" in latest*.yml) continue ;; esac
            sha256sum "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="--generate-notes"
          if [ -f "docs/release-notes/${TAG}.md" ]; then NOTES="--notes-file docs/release-notes/${TAG}.md"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Loom $TAG" $NOTES
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
      # The Homebrew cask carries the version and both checksums. Hand-editing
      # it after each release is a step someone forgets, and a stale sha256 is
      # an install that fails with a checksum mismatch — so it's derived from
      # the artifacts that were just published, in the same job that published
      # them.
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ARM=$(awk '/-arm64\.dmg$/ {print $1}' out/SHA256SUMS.txt)
          INTEL=$(awk '/-x64\.dmg$/ {print $1}' out/SHA256SUMS.txt)
          if [ -z "$ARM" ] || [ -z "$INTEL" ]; then
            echo "no dmg checksums in this release — leaving the cask alone"
            exit 0
          fi
          python3 - "$VERSION" "$ARM" "$INTEL" <<'PY'
          import re, sys
          version, arm, intel = sys.argv[1], sys.argv[2], sys.argv[3]
          p = "Casks/loom-desktop.rb"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'version "[^"]+"', f'version "{version}"', s, count=1)
          s = re.sub(r'sha256 arm:\s+"[0-9a-f]+",\n(\s+)intel: "[0-9a-f]+"',
                     lambda m: f'sha256 arm:   "{arm}",\n{m.group(1)}intel: "{intel}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          git diff --quiet Casks/loom-desktop.rb && { echo "cask already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/loom-desktop.rb
          git commit -m "cask: loom-desktop ${VERSION}"
          git push origin HEAD:main
